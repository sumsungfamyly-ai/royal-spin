<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;background:#0f0a1a;color:#eee;padding:16px;max-width:900px;margin:auto}
h1{color:#f5c542;font-size:22px}input,textarea,button{padding:9px 12px;border-radius:8px;border:1px solid #4b3a6b;background:#1b1129;color:#fff;font-size:14px}
textarea{width:100%;min-height:90px}button{cursor:pointer;background:#f5c542;color:#000;font-weight:700;border:0}button.s{background:#2a1c40;color:#fff}button.d{background:#e11d48;color:#fff}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}.tabs button.on{background:#f5c542;color:#000}.tabs button{background:#2a1c40;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.box{background:#1b1129;border-radius:12px;padding:14px}.box b{display:block;font-size:22px;color:#f5c542}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid #2a1c40;text-align:left}td input{width:100px}
label{display:block;margin:10px 0 4px;color:#a99bc4;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:140px}.row input{width:100%}
#login{max-width:320px;margin:15vh auto;display:grid;gap:10px}.err{color:#f87171}
</style></head><body>
<div id="login"><h1>🔐 Вход в админ-панель</h1><input id="l" placeholder="Логин"><input id="p" type="password" placeholder="Пароль"><button id="in">Войти</button><div class="err" id="e"></div></div>
<div id="app" hidden><h1>🎰 Royal Spin · Админ-панель</h1>
<div class="tabs"><button class="on" data-t="st">Статистика</button><button data-t="us">Игроки</button><button data-t="se">Настройки</button><button data-t="br">Рассылка</button><button id="out" class="d">Выйти</button></div>
<div id="st" class="tab"></div>
<div id="us" class="tab" hidden><table><thead><tr><th>Игрок</th><th>ID</th><th>Баланс</th><th>Игр</th><th></th></tr></thead><tbody id="ub"></tbody></table></div>
<div id="se" class="tab" hidden>
<label>Приветствие бота (/start)</label><textarea id="welcome"></textarea>
<div class="row"><div><label>Стартовый баланс</label><input id="startBalance" type="number"></div><div><label>Ежедневный бонус</label><input id="dailyBonus" type="number"></div>
<div><label>Мин. ставка</label><input id="minBet" type="number"></div><div><label>Макс. ставка</label><input id="maxBet" type="number"></div>
<div><label>Шанс выигрыша в монетке, %</label><input id="flipChance" type="number" step="0.1"></div></div>
<label><input type="checkbox" id="slotsOn"> Слоты включены</label><label><input type="checkbox" id="flipOn"> Монетка включена</label>
<label>Символы слотов (s — символ, w — вес/частота, m — множитель за 3 одинаковых)</label><textarea id="symbols" style="min-height:160px"></textarea>
<p><button id="save">Сохранить</button> <span id="sm"></span></p></div>
<div id="br" class="tab" hidden><label>Текст сообщения всем игрокам</label><textarea id="bt"></textarea><p><button id="bs">Отправить</button> <span id="bm"></span></p></div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let T=localStorage.tk||'';
const api=(action,d={})=>fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json','x-token':T},body:JSON.stringify({action,...d})}).then(async r=>{const j=await r.json();if(r.status==401&&action!='login'){logout();throw new Error('auth')}if(!r.ok)throw new Error(j.error);return j});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function logout(){localStorage.removeItem('tk');T='';$('#app').hidden=true;$('#login').hidden=false}
$('#in').onclick=()=>api('login',{login:$('#l').value,password:$('#p').value}).then(r=>{T=localStorage.tk=r.token;start()}).catch(e=>$('#e').textContent=e.message);
$('#out').onclick=logout;
$$('.tabs button[data-t]').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.toggle('on',x==b));$$('.tab').forEach(t=>t.hidden=t.id!=b.dataset.t);load(b.dataset.t)});
async function load(t){if(t=='st'){const s=await api('stats');$('#st').innerHTML='<div class="grid">'+[['Игроков',s.users],['Игр сыграно',s.games],['Ставки',s.bets],['Выплаты',s.payouts],['Прибыль казино',s.profit],['Возврат игрокам (RTP)',s.rtp+'%']].map(x=>`<div class="box">${x[0]}<b>${x[1]}</b></div>`).join('')+'</div>'}
 if(t=='us'){const r=await api('users');$('#ub').innerHTML=r.users.map(u=>`<tr><td>${esc(u.name)}${u.banned?' 🚫':''}</td><td>${u.id}</td><td><input type="number" value="${u.balance}" id="b${u.id}"> <button class="s" onclick="sb(${u.id})">OK</button></td><td>${u.games}</td><td><button class="${u.banned?'s':'d'}" onclick="bn(${u.id},${!u.banned})">${u.banned?'Разбан':'Бан'}</button></td></tr>`).join('')}
 if(t=='se'){const s=await api('getSettings');for(const k of['welcome','startBalance','dailyBonus','minBet','maxBet','flipChance'])$('#'+k).value=s[k];$('#slotsOn').checked=s.slotsOn;$('#flipOn').checked=s.flipOn;$('#symbols').value=JSON.stringify(s.symbols,null,1)}}
window.sb=(id)=>api('setBalance',{id,balance:$('#b'+id).value}).then(()=>load('us'));
window.bn=(id,banned)=>api('ban',{id,banned}).then(()=>load('us'));
$('#save').onclick=async()=>{try{const s={slotsOn:$('#slotsOn').checked,flipOn:$('#flipOn').checked,symbols:JSON.parse($('#symbols').value)};for(const k of['welcome','startBalance','dailyBonus','minBet','maxBet','flipChance'])s[k]=$('#'+k).value;await api('saveSettings',{settings:s});$('#sm').textContent='✅ Сохранено'}catch(e){$('#sm').textContent='❌ '+e.message}};
$('#bs').onclick=()=>api('broadcast',{text:$('#bt').value}).then(r=>$('#bm').textContent=`Отправлено ${r.sent} из ${r.total}`).catch(e=>$('#bm').textContent=e.message);
function start(){$('#login').hidden=true;$('#app').hidden=false;load('st').catch(()=>{})}
if(T)start();
</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель · Royal Spin</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;background:#0a0a0d;color:#eee;padding:16px;max-width:1000px;margin:auto}
h1{color:#d8b872;font-size:22px;margin:0}h2{font-size:16px;color:#d8b872;margin:18px 0 8px}
input,textarea,button,select{padding:9px 12px;border-radius:8px;border:1px solid #2c2d36;background:#15161b;color:#fff;font-size:14px}textarea{width:100%;min-height:90px}
button{cursor:pointer;background:#d8b872;color:#1a1409;font-weight:700;border:0}button.s{background:#1c1d24;color:#fff}button.d{background:#e11d48;color:#fff}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}.tabs button{background:#1c1d24;color:#fff}.tabs button.on{background:#d8b872;color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.box{background:#15161b;border-radius:12px;padding:14px;font-size:13px;color:#8f8d87}.box b{display:block;font-size:22px;color:#d8b872}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 6px;border-bottom:1px solid #1c1d24;text-align:left}th{color:#8f8d87;font-weight:600}td input{width:90px;padding:5px 8px}
label{display:block;margin:10px 0 4px;color:#8f8d87;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:140px}.row input{width:100%}
.chk{display:inline-flex;align-items:center;gap:6px;margin:6px 14px 6px 0;color:#eee}.chk input{width:auto}
#login{max-width:320px;margin:15vh auto;display:grid;gap:10px}.err{color:#f87171}.ok{color:#22c55e}.bar{height:8px;background:#1c1d24;border-radius:5px}.bar i{display:block;height:100%;background:#d8b872;border-radius:5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:4px}.dot.on{background:#22c55e}
</style><link rel="stylesheet" href="/admin.css"></head><body>
<div id="login"><h1>🔐 Вход в админ-панель</h1><input id="l" placeholder="Логин"><input id="p" type="password" placeholder="Пароль"><button id="in">Войти</button><div class="err" id="e"></div></div>
<div id="app" hidden><h1>🎰 Royal Spin · Админ-панель</h1>
<div class="tabs"><button class="on" data-t="st">📊 Дашборд</button><button data-t="us">👥 Игроки</button><button data-t="lb">🏆 Рейтинг <b id="lbb"></b></button><button data-t="gm">🎮 Игры</button><button data-t="pr">🎟 Промокоды</button><button data-t="br">📣 Рассылка</button><button data-t="se">⚙️ Настройки</button><button id="out" class="d">Выйти</button></div>
<div id="st" class="tab"></div>
<div id="us" class="tab" hidden><div class="row"><div><input id="q" placeholder="Поиск по имени или ID"></div><div><button class="s" id="ga">🎁 Выдать всем…</button></div></div><table><thead><tr><th>Игрок</th><th>ID</th><th>Баланс</th><th>Игр / побед</th><th>Друзей</th><th>Был</th><th></th></tr></thead><tbody id="ub"></tbody></table></div>
<div id="lb" class="tab" hidden>
<label class="chk"><input type="checkbox" id="lbo"> Рейтинг открыт для всех игроков (без заявок)</label><span id="lbomsg" class="sm"></span>
<h2>Заявки на вступление</h2><table><tbody id="lbp"></tbody></table>
<h2>Участники рейтинга (по заявке)</h2><table><tbody id="lba"></tbody></table>
<h2 id="mh">Добавить человека вручную</h2>
<div class="row"><div><input id="mn" placeholder="Ник"></div><div><input id="ma" placeholder="Аватар-эмодзи" value="🏆"></div><div><input id="mb" type="number" placeholder="Очки (баланс)"></div><div><input id="ml" type="number" placeholder="Уровень" value="1"></div><div><input id="mg" type="number" placeholder="Рекорд выигрыша"></div></div>
<p><button id="mbtn">Добавить в рейтинг</button> <button class="s" id="mcn" hidden>Отмена</button> <span id="mmsg"></span></p>
<table><tbody id="lbm"></tbody></table></div>
<div id="gm" class="tab" hidden><h2>Включённые игры</h2><div id="gt"></div>
<div class="row"><div><label>Шанс выигрыша в монетке, %</label><input id="flipChance" type="number" step="0.1"></div><div><label>Комиссия казино в кости/краш/дуэлях, %</label><input id="edge" type="number" step="0.1"></div><div><label>Комиссия дуэлей, %</label><input id="duelFee" type="number" step="0.1"></div></div>
<label>Символы слотов (s — символ, w — частота, m — множитель за 3 одинаковых)</label><textarea id="symbols" style="min-height:170px"></textarea><p><button class="sv">Сохранить</button> <span class="sm"></span></p></div>
<div id="pr" class="tab" hidden><h2>Создать промокод</h2><div class="row"><div><input id="pcode" placeholder="КОД (латиница)"></div><div><input id="pamt" type="number" placeholder="Фишек"></div><div><input id="pmax" type="number" placeholder="Лимит активаций (0 — без)"></div><div><button id="pcr">Создать</button></div></div><div id="pmsg"></div><table><thead><tr><th>Код</th><th>Фишек</th><th>Использовано</th><th></th></tr></thead><tbody id="pl"></tbody></table></div>
<div id="br" class="tab" hidden><label>Сообщение всем игрокам (через бота)</label><textarea id="bt"></textarea><p><button id="bs">Отправить</button> <span id="bm"></span></p></div>
<div id="se" class="tab" hidden><label>Приветствие бота (/start)</label><textarea id="welcome"></textarea>
<div class="row"><div><label>Цена платной попытки колеса</label><input id="wheelCost" type="number"></div><div><label>Бонус за приглашённого (каждому)</label><input id="refBonus" type="number"></div><div><label>Стартовый баланс</label><input id="startBalance" type="number"></div><div><label>Ежедневный бонус</label><input id="dailyBonus" type="number"></div><div><label>Мин. ставка</label><input id="minBet" type="number"></div><div><label>Макс. ставка</label><input id="maxBet" type="number"></div></div>
<label>FAQ: вопросы и ответы (JSON: q — вопрос, a — ответ)</label><textarea id="faq" style="min-height:220px"></textarea>
<p><button class="sv">Сохранить</button> <span class="sm"></span></p></div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let T=localStorage.tk||'',ST={},US=[];
const api=(action,d={})=>fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json','x-token':T},body:JSON.stringify({action,...d})}).then(async r=>{const j=await r.json();if(r.status==401&&action!='login'){logout();throw new Error('auth')}if(!r.ok)throw new Error(j.error);return j});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const f=n=>Number(n).toLocaleString('ru');
const GN={slots:'🎰 Слоты',flip:'🪙 Монетка',dice:'🎲 Кости',roulette:'🎡 Рулетка',crash:'🚀 Краш',mines:'💣 Мины',blackjack:'🃏 Блэкджек',rps:'✊ КНБ',hilo:'🔺 Хай-Лоу',durak:'🃏 Дурак',plinko:'🔮 Плинко',checkers:'♟️ Шашки',connect4:'🔴 Четыре в ряд',coblast:'🧩 Блок Бласт вдвоём',comines:'💣 Мины вдвоём',blockblast:'🧩 Блок Бласт',wheel:'🎁 Колесо',duel:'⚔️ Дуэли'};
function logout(){localStorage.removeItem('tk');T='';$('#app').hidden=true;$('#login').hidden=false}
$('#in').onclick=()=>api('login',{login:$('#l').value,password:$('#p').value}).then(r=>{T=localStorage.tk=r.token;start()}).catch(e=>$('#e').textContent=e.message);$('#out').onclick=logout;
$$('.tabs button[data-t]').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.toggle('on',x==b));$$('.tab').forEach(t=>t.hidden=t.id!=b.dataset.t);load(b.dataset.t)});
const ago=t=>{if(!t)return'—';const m=(Date.now()-t)/6e4;return m<5?'<span class="dot on"></span>онлайн':m<60?Math.round(m)+' мин':m<1440?Math.round(m/60)+' ч':Math.round(m/1440)+' дн'};
let LB=null,editId=null;
const mrow=(x,btns)=>`<tr><td>${esc(x.avatar||'😎')} <b>${esc(x.nick)}</b></td>${x.id!==undefined&&x.balance!==undefined?`<td>${f(x.balance)} оч.</td><td>ур. ${x.level}</td>`:''}<td>${btns}</td></tr>`;
function drawLb(){if(!LB)return;$('#lbo').checked=!!LB.open;const nb=LB.pending.length;$('#lbb').textContent=nb?'('+nb+')':'';
 $('#lbp').innerHTML=LB.pending.map(x=>`<tr><td>${esc(x.avatar)} <b>${esc(x.nick)}</b><br><small>ID ${x.id}</small></td><td>${f(x.balance)} фишек</td><td>ур. ${x.level} · ${x.games} игр</td><td><button data-ok="${x.id}">Принять</button> <button class="d" data-no="${x.id}">Отклонить</button></td></tr>`).join('')||'<tr><td>Новых заявок нет</td></tr>';
 $('#lba').innerHTML=LB.approved.map(x=>`<tr><td>${esc(x.avatar)} <b>${esc(x.nick)}</b><br><small>ID ${x.id}</small></td><td>${f(x.balance)} фишек</td><td>ур. ${x.level}</td><td><button class="d" data-rm="${x.id}">Убрать</button></td></tr>`).join('')||'<tr><td>Пока никого</td></tr>';
 $('#lbm').innerHTML=LB.manual.map(x=>mrow(x,`<button class="s" data-me="${x.id}">Изменить</button> <button class="d" data-md="${x.id}">Удалить</button>`)).join('')||'<tr><td>Ручных записей нет</td></tr>';
 $('#mbtn').textContent=editId?'Сохранить изменения':'Добавить в рейтинг';$('#mcn').hidden=!editId;$('#mh').textContent=editId?'Изменить запись':'Добавить человека вручную'}
async function loadLb(){LB=await api('lbList');drawLb()}
function lbReset(){editId=null;['mn','mb','mg'].forEach(i=>$('#'+i).value='');$('#ma').value='🏆';$('#ml').value=1;drawLb()}
$('#lb').onclick=async e=>{const t=e.target,id=t.dataset;try{
 if(id.ok){await api('lbDecide',{id:id.ok,ok:true});await loadLb()}
 else if(id.no){const n=prompt('Причина отказа (можно оставить пустой)');if(n===null)return;await api('lbDecide',{id:id.no,ok:false,note:n});await loadLb()}
 else if(id.rm){if(!confirm('Убрать игрока из рейтинга?'))return;await api('lbRemove',{id:id.rm});await loadLb()}
 else if(id.md){if(!confirm('Удалить запись?'))return;LB.manual=(await api('lbManualDelete',{id:id.md})).manual;if(editId==id.md)lbReset();else drawLb()}
 else if(id.me){const x=LB.manual.find(y=>y.id==id.me);editId=x.id;$('#mn').value=x.nick;$('#ma').value=x.avatar;$('#mb').value=x.balance;$('#ml').value=x.level;$('#mg').value=x.biggest;drawLb();window.scrollTo(0,document.body.scrollHeight)}
 }catch(err){alert(err.message)}};
$('#mbtn').onclick=async()=>{try{const r=await api('lbManualSave',{id:editId,nick:$('#mn').value,avatar:$('#ma').value,balance:$('#mb').value,level:$('#ml').value,biggest:$('#mg').value});LB.manual=r.manual;$('#mmsg').textContent='✅ Сохранено';lbReset()}catch(e){$('#mmsg').textContent='❌ '+e.message}};
$('#mcn').onclick=lbReset;
$('#lbo').onchange=async function(){try{await api('lbMode',{open:this.checked});$('#lbomsg').textContent='✅ Сохранено';await loadLb()}catch(e){$('#lbomsg').textContent='❌ '+e.message}};
async function load(t){if(t=='lb')return loadLb();
 if(t=='st'){const s=await api('stats');const mx=Math.max(1,...s.per.map(x=>x.bets));
  $('#st').innerHTML='<div class="grid">'+[['Игроков',f(s.users)],['Онлайн (5 мин)',f(s.online)],['Новых за 24 ч',f(s.new24)],['Фишек у игроков',f(s.chips)],['Игр сыграно',f(s.games)],['Ставки',f(s.bets)],['Выплаты',f(s.payouts)],['Прибыль казино',f(s.profit)],['Возврат игрокам (RTP)',s.rtp+'%']].map(x=>`<div class="box">${x[0]}<b>${x[1]}</b></div>`).join('')+'</div><h2>По играм</h2><table><thead><tr><th>Игра</th><th>Раундов</th><th>Ставки</th><th>Выплаты</th><th>Прибыль</th><th>RTP</th><th></th></tr></thead><tbody>'+s.per.map(x=>`<tr><td>${GN[x.g]}</td><td>${f(x.n)}</td><td>${f(x.bets)}</td><td>${f(x.payouts)}</td><td>${f(x.bets-x.payouts)}</td><td>${x.bets?(x.payouts/x.bets*100).toFixed(1)+'%':'—'}</td><td style="width:20%"><div class="bar"><i style="width:${x.bets/mx*100}%"></i></div></td></tr>`).join('')+'</tbody></table>'}
 if(t=='us'){US=(await api('users')).users;draw()}
 if(t=='gm'||t=='se'){ST=await api('getSettings');for(const k of['welcome','startBalance','dailyBonus','minBet','maxBet','flipChance','edge','duelFee','refBonus','wheelCost'])$('#'+k).value=ST[k];$('#faq').value=JSON.stringify(ST.faq,null,1);$('#symbols').value=JSON.stringify(ST.symbols,null,1);
  $('#gt').innerHTML=Object.keys(GN).map(k=>`<label class="chk"><input type="checkbox" data-g="${k}" ${ST.games[k]?'checked':''}> ${GN[k]}</label>`).join('')}
 if(t=='pr'){const r=await api('promoList');$('#pl').innerHTML=r.promos.map(p=>`<tr><td><b>${esc(p.code)}</b></td><td>${f(p.amount)}</td><td>${p.used}${p.max?' / '+p.max:''}</td><td><button class="d" data-pd="${esc(p.code)}">Удалить</button></td></tr>`).join('')||'<tr><td colspan=4>Пока нет промокодов</td></tr>';$$('[data-pd]').forEach(b=>b.onclick=()=>api('promoDelete',{code:b.dataset.pd}).then(()=>load('pr')))}}
function draw(){const q=$('#q').value.toLowerCase();$('#ub').innerHTML=US.filter(u=>!q||(u.name+u.tg+u.id).toLowerCase().includes(q)).map(u=>`<tr><td>${u.avatar} ${esc(u.name)}${u.banned?' 🚫':''}</td><td>${u.id}</td><td><input type="number" value="${u.balance}" id="b${u.id}"> <button class="s" data-sb="${u.id}">OK</button></td><td>${u.games} / ${u.wins}</td><td>${u.friends}</td><td>${ago(u.lastSeen)}</td><td><button class="${u.banned?'s':'d'}" data-bn="${u.id}:${!u.banned}">${u.banned?'Разбан':'Бан'}</button></td></tr>`).join('');
 $$('[data-sb]').forEach(b=>b.onclick=()=>api('setBalance',{id:b.dataset.sb,balance:$('#b'+b.dataset.sb).value}).then(()=>load('us')));$$('[data-bn]').forEach(b=>{const[i,v]=b.dataset.bn.split(':');b.onclick=()=>api('ban',{id:i,banned:v=='true'}).then(()=>load('us'))})}
$('#q').oninput=draw;$('#ga').onclick=()=>{const a=prompt('Сколько фишек выдать каждому игроку? (отрицательное — списать)');if(a)api('giveAll',{amount:a}).then(r=>{alert('Готово: '+r.count+' игроков');load('us')}).catch(e=>alert(e.message))};
$$('.sv').forEach(b=>b.onclick=async()=>{const m=b.parentNode.querySelector('.sm');try{const s={games:{}};$$('[data-g]').forEach(c=>s.games[c.dataset.g]=c.checked);s.symbols=JSON.parse($('#symbols').value);s.faq=JSON.parse($('#faq').value);for(const k of['welcome','startBalance','dailyBonus','minBet','maxBet','flipChance','edge','duelFee','refBonus','wheelCost'])s[k]=$('#'+k).value;await api('saveSettings',{settings:s});m.className='sm ok';m.textContent='✅ Сохранено'}catch(e){m.className='sm err';m.textContent='❌ '+e.message}});
$('#pcr').onclick=()=>api('promoCreate',{code:$('#pcode').value,amount:$('#pamt').value,max:$('#pmax').value}).then(()=>{$('#pmsg').textContent='✅ Создан';load('pr')}).catch(e=>$('#pmsg').textContent='❌ '+e.message);
$('#bs').onclick=()=>api('broadcast',{text:$('#bt').value}).then(r=>$('#bm').textContent=`Отправлено ${r.sent} из ${r.total}`).catch(e=>$('#bm').textContent=e.message);
function start(){$('#login').hidden=true;$('#app').hidden=false;load('st').catch(()=>{});api('lbList').then(r=>{const n=r.pending.length;$('#lbb').textContent=n?'('+n+')':''}).catch(()=>{})}if(T)start();else if(/[?&]tg=1/.test(location.search)){try{api('tglogin',{initData:parent.Telegram.WebApp.initData}).then(r=>{T=localStorage.tk=r.token;start()}).catch(e=>$('#e').textContent=e.message)}catch(e){}}if(/[?&]tg=1/.test(location.search))document.body.classList.add('emb');
</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Royal Spin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--g:#f5c542;--bg:#0b0613;--c:#1b1129;--ok:#22c55e;--bad:#f87171;--l:#4b3a6b}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 50% -10%,#41136b,var(--bg) 65%) fixed;color:#fff;min-height:100vh;padding:12px 12px 90px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.logo{font-weight:800;color:var(--g);letter-spacing:1px}
.bal{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:8px 14px;font-weight:700;color:var(--g)}.bal.pop{animation:pop .5s}@keyframes pop{50%{transform:scale(1.2);box-shadow:0 0 20px var(--g)}}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#120a1e;border-top:1px solid var(--l);padding:6px 6px 14px;z-index:5}
nav button{flex:1;background:none;border:0;color:#9a8bb5;font-size:11px;padding:6px}nav button span{display:block;font-size:22px}nav button.on{color:var(--g)}
.card{background:var(--c);border:1px solid #3a2a55;border-radius:18px;padding:14px;margin-bottom:12px}h3{margin:0 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gc{background:linear-gradient(160deg,#2a1747,#1b1129);border:1px solid var(--l);border-radius:18px;padding:16px 10px;text-align:center;color:#fff;font-size:15px;font-weight:700}
.gc i{display:block;font-style:normal;font-size:38px;margin-bottom:4px}.gc small{display:block;font-weight:400;color:#9a8bb5;margin-top:2px}.gc.off{opacity:.35}
input,textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--l);background:#0d0818;color:#fff;font-size:16px;text-align:center}textarea{text-align:left;resize:none}
.chips{display:flex;gap:6px;margin:8px 0 12px}.chips button,.opt button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--l);background:transparent;color:#fff}
.go{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(#ffd75e,#e0a812);color:#000;font-size:17px;font-weight:800}.go:disabled{opacity:.5}
.sm{padding:8px 12px;border:0;border-radius:10px;background:#2a1c40;color:#fff;font-size:13px}.sm.p{background:var(--g);color:#000}.sm.r{background:#7f1d36}
.back{background:none;border:0;color:var(--g);font-size:15px;margin-bottom:10px}
.msg{text-align:center;min-height:24px;font-weight:700;margin-top:10px}.win{color:var(--ok)}.lose{color:var(--bad)}
.reels{display:flex;gap:10px;margin:6px 0 14px}.reel{flex:1;aspect-ratio:1;background:#0d0818;border:2px solid var(--g);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:48px}
.spin{animation:b .25s infinite}@keyframes b{50%{transform:translateY(-5px)}}
.coin{font-size:84px;text-align:center;margin:6px 0}.coin.spin{animation:f .6s infinite linear}@keyframes f{to{transform:rotateY(360deg)}}
.opt{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.opt button.on{border-color:var(--g);background:#2a1c40}
.big{font-size:54px;font-weight:800;text-align:center;color:var(--g);margin:6px 0}.rn{width:110px;height:110px;border-radius:50%;margin:8px auto;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;border:5px solid var(--g);background:#333}
.rn.red{background:#b91c1c}.rn.black{background:#111}.rn.green{background:#15803d}
.rocket{font-size:40px;transition:transform .1s linear;height:50px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #2a1c40}.row:last-child{border:0}.row .n{flex:1;min-width:0}.row .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:#9a8bb5}
.av{font-size:30px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:4px}.dot.on{background:var(--ok)}
.bar{height:8px;background:#0d0818;border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--g)}
.avs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}.avs button{font-size:28px;background:#0d0818;border:2px solid transparent;border-radius:12px;padding:4px 8px}.avs button.on{border-color:var(--g)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin:10px 0}.stats div{background:#0d0818;border-radius:12px;padding:8px}.stats b{display:block;color:var(--g)}
table{width:100%;font-size:14px}td{padding:4px 0}td:last-child{text-align:right;color:var(--g)}small{color:#9a8bb5}
.cf{position:fixed;top:-30px;z-index:99;animation:fall linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
input[type=range]{padding:0;accent-color:var(--g)}
</style></head><body>
<div class="top"><div class="logo">🎰 ROYAL SPIN</div><div class="bal" id="bal">…</div></div>
<main>
<section id="v-games"><div class="grid" id="gg"></div><button class="go" id="bonus" style="margin-top:12px">🎁 Ежедневный бонус</button></section>
<section id="v-game" hidden><button class="back" id="bk">← Все игры</button><div id="gbody"></div></section>
<section id="v-friends" hidden></section>
<section id="v-top" hidden></section>
<section id="v-me" hidden></section>
</main>
<nav><button data-v="games" class="on"><span>🎮</span>Игры</button><button data-v="friends"><span>👥</span>Друзья</button><button data-v="top"><span>🏆</span>Топ</button><button data-v="me"><span>👤</span>Профиль</button></nav>
<script>
window.onerror=(m,u,l)=>{const d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;background:#7f1d36;color:#fff;padding:8px;font-size:12px;z-index:999';d.textContent='Ошибка: '+m+' (стр. '+l+')';document.body.appendChild(d)};
const tg=(window.Telegram&&window.Telegram.WebApp)||{initData:'',ready(){},expand(){},showAlert:m=>alert(m),showConfirm:(m,f)=>f(confirm(m))};tg.ready();tg.expand();
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cfg,me,timers=[],busy=false,view='games';
const fmt=n=>Number(n).toLocaleString('ru'),sleep=ms=>new Promise(z=>setTimeout(z,ms));
const api=(action,d={})=>fetch('/api/game',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({initData:tg.initData,action,...d})}).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');if(j.me)setMe(j.me);return j});
function setMe(m){const up=me&&m.balance>me.balance;me=m;const b=$('#bal');b.textContent='🪙 '+fmt(m.balance);if(up){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}}
const hap=t=>{try{tg.HapticFeedback.notificationOccurred(t)}catch{}};
function boom(e='🪙'){for(let i=0;i<26;i++){const s=document.createElement('span');s.className='cf';s.textContent=e;s.style.left=Math.random()*100+'vw';s.style.animationDuration=1.2+Math.random()*1.6+'s';s.style.fontSize=16+Math.random()*22+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),3200)}}
function res(el,win,bet){el=$(el);el.className='msg '+(win?'win':'lose');el.textContent=win?`Выигрыш +${fmt(win)} 🪙`:`Проигрыш −${fmt(bet)}`;hap(win?'success':'error');if(win>=bet*5)boom(win>=bet*20?'💎':'🪙')}
const fail=(el,e)=>{$(el).className='msg lose';$(el).textContent=e.message};
const betBox=()=>`<input type="number" class="amt" inputmode="numeric" value="${Math.min(cfg.minBet*5,cfg.maxBet)}"><div class="chips">${['MIN','½','x2','MAX'].map(x=>`<button data-chip="${x}">${x}</button>`).join('')}</div>`;
document.addEventListener('click',e=>{const c=e.target.closest('[data-chip]');if(!c)return;const i=c.closest('.card').querySelector('.amt'),v=+i.value||cfg.minBet,k=c.dataset.chip;i.value=k=='MIN'?cfg.minBet:k=='MAX'?Math.min(cfg.maxBet,me.balance):k=='x2'?Math.min(v*2,cfg.maxBet):Math.max(Math.floor(v/2),cfg.minBet)});
const bet=()=>+$('#gbody .amt').value;
const stopAll=()=>{timers.forEach(t=>{clearInterval(t);clearTimeout(t)});timers=[]};
const sel=(box,fn)=>$$('button',$(box)).forEach(b=>b.onclick=()=>{$$('button',$(box)).forEach(x=>x.classList.toggle('on',x==b));fn(b)});
const run=async(fn)=>{if(busy)return;busy=true;try{await fn()}finally{busy=false}};

/* ---------- игры ---------- */
const G={
slots:{t:'Слоты',i:'🎰',d:'до x150',r(){$('#gbody').innerHTML=`<div class="card"><div class="reels">${'<div class="reel">🎰</div>'.repeat(3)}</div>${betBox()}<button class="go" id="go">КРУТИТЬ</button><div class="msg" id="m"></div></div><div class="card"><small>3 одинаковых символа</small><table>${cfg.symbols.map(x=>`<tr><td>${x.s} ${x.s} ${x.s}</td><td>x${x.m}</td></tr>`).join('')}</table></div>`;
 $('#go').onclick=()=>run(async()=>{const b=bet(),R=$$('.reel'),S=cfg.symbols.map(x=>x.s);R.forEach(r=>r.classList.add('spin'));const iv=setInterval(()=>R.forEach(r=>r.textContent=S[Math.random()*S.length|0]),90);$('#m').textContent='';
  try{const[r]=await Promise.all([api('slots',{bet:b}),sleep(1100)]);clearInterval(iv);for(let i=0;i<3;i++){await sleep(250);R[i].classList.remove('spin');R[i].textContent=r.reels[i]}res('#m',r.win,b)}catch(e){clearInterval(iv);R.forEach(r=>r.classList.remove('spin'));fail('#m',e)}})}},
flip:{t:'Монетка',i:'🪙',d:'x2',r(){let side='heads';$('#gbody').innerHTML=`<div class="card"><div class="coin" id="coin">🪙</div><div class="opt" id="sd"><button class="on" data-s="heads">🦅 Орёл</button><button data-s="tails">🔘 Решка</button></div>${betBox()}<button class="go" id="go">БРОСИТЬ</button><div class="msg" id="m"></div></div>`;
 sel('#sd',b=>side=b.dataset.s);$('#go').onclick=()=>run(async()=>{const b=bet(),c=$('#coin');c.classList.add('spin');$('#m').textContent='';try{const[r]=await Promise.all([api('flip',{bet:b,side}),sleep(900)]);c.classList.remove('spin');c.textContent=r.result=='heads'?'🦅':'🔘';res('#m',r.win,b)}catch(e){c.classList.remove('spin');fail('#m',e)}})}},
dice:{t:'Кости',i:'🎲',d:'свой шанс',r(){let mode='under';$('#gbody').innerHTML=`<div class="card"><div class="big" id="roll">00.00</div><div class="opt" id="md"><button class="on" data-m="under">Меньше</button><button data-m="over">Больше</button></div><input type="range" id="tg" min="2" max="98" value="50"><div style="text-align:center;margin:8px 0" id="info"></div>${betBox()}<button class="go" id="go">БРОСИТЬ</button><div class="msg" id="m"></div></div>`;
 const info=()=>{const t=+$('#tg').value,ch=mode=='under'?t:100-t;$('#info').innerHTML=`${mode=='under'?'Выпадет меньше':'Выпадет больше'} <b>${t}</b> · шанс <b>${ch}%</b> · <b style="color:var(--g)">x${((100-cfg.edge)/ch).toFixed(2)}</b>`};info();$('#tg').oninput=info;sel('#md',b=>{mode=b.dataset.m;info()});
 $('#go').onclick=()=>run(async()=>{const b=bet(),el=$('#roll');const iv=setInterval(()=>el.textContent=(Math.random()*100).toFixed(2).padStart(5,'0'),50);$('#m').textContent='';
  try{const[r]=await Promise.all([api('dice',{bet:b,mode,target:+$('#tg').value}),sleep(900)]);clearInterval(iv);el.textContent=r.roll.toFixed(2).padStart(5,'0');res('#m',r.win,b)}catch(e){clearInterval(iv);fail('#m',e)}})}},
roulette:{t:'Рулетка',i:'🎡',d:'x2 · x36',r(){let kind='red';const K=[['red','🔴 Красное'],['black','⚫ Чёрное'],['even','Чёт'],['odd','Нечет'],['low','1-18'],['high','19-36'],['num','Число x36']];
 $('#gbody').innerHTML=`<div class="card"><div class="rn" id="rn">0</div><div class="opt" id="ko">${K.map(k=>`<button data-k="${k[0]}" class="${k[0]=='red'?'on':''}">${k[1]}</button>`).join('')}</div><input type="number" id="num" min="0" max="36" placeholder="Число 0–36" hidden style="margin-bottom:8px">${betBox()}<button class="go" id="go">КРУТИТЬ</button><div class="msg" id="m"></div></div>`;
 sel('#ko',b=>{kind=b.dataset.k;$('#num').hidden=kind!='num'});$('#go').onclick=()=>run(async()=>{const b=bet(),el=$('#rn');el.className='rn';const iv=setInterval(()=>el.textContent=Math.random()*37|0,60);$('#m').textContent='';
  try{const[r]=await Promise.all([api('roulette',{bet:b,kind,num:$('#num').value}),sleep(1500)]);clearInterval(iv);el.textContent=r.n;el.className='rn '+r.color;res('#m',r.win,b)}catch(e){clearInterval(iv);fail('#m',e)}})}},
crash:{t:'Краш',i:'🚀',d:'забери вовремя',r(){$('#gbody').innerHTML=`<div class="card"><div class="big" id="cm">1.00x</div><div class="rocket" id="rk">🚀</div>${betBox()}<button class="go" id="go">СТАРТ</button><div class="msg" id="m"></div></div>`;
 let on=false,t0=0,iv,pv;const stop=()=>{on=false;clearInterval(iv);clearInterval(pv);$('#go').textContent='СТАРТ';$('#go').disabled=false};
 const tick=()=>{const m=Math.exp(0.1*(Date.now()-t0)/1000);$('#cm').textContent=m.toFixed(2)+'x';$('#rk').style.transform=`translate(${Math.min(m*10,230)}px,-${Math.min((m-1)*25,40)}px)`};
 const crashed=cp=>{stop();$('#cm').textContent=cp.toFixed(2)+'x';$('#cm').style.color='var(--bad)';$('#rk').textContent='💥';$('#m').className='msg lose';$('#m').textContent='Ракета улетела!';hap('error')};
 const start=()=>{on=true;$('#go').textContent='ЗАБРАТЬ';$('#cm').style.color='var(--g)';$('#rk').textContent='🚀';iv=setInterval(tick,80);pv=setInterval(async()=>{try{const r=await api('crash_poll');if(r.crashed)crashed(r.cp);else if(r.idle)stop()}catch{}},700);timers.push(iv,pv)};
 $('#go').onclick=()=>run(async()=>{try{if(!on){$('#m').textContent='';await api('crash_start',{bet:bet()});t0=Date.now();start()}else{const r=await api('crash_cash');if(r.crashed)crashed(r.cp);else{stop();$('#cm').textContent=r.m.toFixed(2)+'x';res('#m',r.win,bet())}}}catch(e){fail('#m',e)}});
 api('crash_poll').then(r=>{if(r.m){t0=Date.now()-r.t*1000;start()}}).catch(()=>{})}}
};
function renderGames(){$('#gg').innerHTML=Object.entries(G).map(([k,g])=>`<button class="gc ${cfg.games[k]?'':'off'}" data-g="${k}"><i>${g.i}</i>${g.t}<small>${g.d}</small></button>`).join('')+`<button class="gc" data-v="friends"><i>⚔️</i>Дуэли<small>с друзьями онлайн</small></button>`;
 $$('#gg .gc').forEach(b=>b.onclick=()=>{if(b.dataset.v)return nav('friends');if(!cfg.games[b.dataset.g])return tg.showAlert('Игра временно отключена');openGame(b.dataset.g)})}
function openGame(g){stopAll();$$('main>section').forEach(s=>s.hidden=s.id!='v-game');G[g].r()}
$('#bk').onclick=()=>nav('games');
$('#bonus').onclick=()=>api('bonus').then(r=>{boom();tg.showAlert(r.msg)}).catch(e=>tg.showAlert(e.message));

/* ---------- разделы ---------- */
function nav(v){stopAll();view=v;$$('main>section').forEach(s=>s.hidden=s.id!='v-'+v);$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));if(v=='friends')social();if(v=='top')loadTop();if(v=='me')profile()}
$$('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.v));
async function loadTop(){const r=await api('top');$('#v-top').innerHTML=`<div class="card"><h3>🏆 Лучшие игроки</h3>${r.top.map((u,i)=>`<div class="row"><b>${['🥇','🥈','🥉'][i]||i+1+'.'}</b><span class="av">${u.avatar}</span><div class="n"><b>${esc(u.nick)}</b><small>Ур. ${u.level}</small></div><b style="color:var(--g)">${fmt(u.balance)}</b></div>`).join('')}</div>`}
function profile(){const m=me,pc=Math.min(100,(m.xp-m.xpFrom)/(m.xpTo-m.xpFrom)*100);
 $('#v-me').innerHTML=`<div class="card"><div class="avs">${cfg.avatars.map(a=>`<button class="${a==m.avatar?'on':''}">${a}</button>`).join('')}</div><input id="nick" maxlength="20" placeholder="Никнейм" value="${esc(m.nick)}" style="margin-bottom:8px"><textarea id="bio" rows="2" maxlength="60" placeholder="О себе">${esc(m.bio)}</textarea><button class="go" id="sv" style="margin-top:8px">Сохранить профиль</button>
 <div style="margin-top:12px"><b>Уровень ${m.level}</b> <small>${fmt(m.xp)} / ${fmt(m.xpTo)} XP</small><div class="bar"><i style="width:${pc}%"></i></div></div>
 <div class="stats"><div><b>${fmt(m.games)}</b>игр</div><div><b>${fmt(m.wins)}</b>побед</div><div><b>${fmt(m.biggest)}</b>рекорд</div></div><small>Твой ID для друзей: <b style="color:var(--g)">${m.id}</b></small></div>
 <div class="card"><h3>🎟 Промокод</h3><input id="pc" placeholder="Введи промокод" style="text-transform:uppercase"><button class="go" id="pb" style="margin-top:8px">Активировать</button></div>`;
 let av=m.avatar;$$('.avs button').forEach(b=>b.onclick=()=>{av=b.textContent;$$('.avs button').forEach(x=>x.classList.toggle('on',x==b))});
 $('#sv').onclick=()=>api('profile',{nick:$('#nick').value,avatar:av,bio:$('#bio').value}).then(r=>tg.showAlert(r.msg)).catch(e=>tg.showAlert(e.message));
 $('#pb').onclick=()=>api('promo',{code:$('#pc').value}).then(r=>{boom();tg.showAlert(r.msg);profile()}).catch(e=>tg.showAlert(e.message))}

/* ---------- друзья и дуэли ---------- */
const DT={dice:'🎲 Кости',card:'🃏 Старшая карта',rps:'✊ Камень-ножницы-бумага'},RP={r:'✊',p:'✋',s:'✌️'};
let soc=null,pollT=null;
async function social(){try{soc=await api('social')}catch(e){return tg.showAlert(e.message)}drawSocial();clearTimeout(pollT);
 if(view=='friends'){const busyM=soc.matches.some(m=>m.status=='pending'||m.status=='active');pollT=setTimeout(()=>{if(view=='friends'&&!document.hidden&&!($('#duel')&&$('#duel').dataset.open))social()},busyM?4000:20000);timers.push(pollT)}}
function drawSocial(){const P=Object.fromEntries(soc.people.map(p=>[p.id,p])),nm=id=>id==me.id?'Ты':esc((P[id]&&P[id].nick)||'Игрок');
 const fr=soc.friends.map(id=>P[id]).filter(Boolean);
 const mt=soc.matches.map(m=>{const mineA=m.a==me.id,opp=mineA?m.b:m.a,box=`<div class="row"><div class="n"><b>${DT[m.type]} · ${fmt(m.bet)} 🪙</b><small>${mineA?'Ты → '+nm(opp):nm(opp)+' → ты'}</small></div>`;let act='';
  if(m.status=='pending')act=mineA?`<small>ждём</small> <button class="sm r" data-dd="${m.id}">Отмена</button>`:`<button class="sm p" data-da="${m.id}">Принять</button> <button class="sm r" data-dd="${m.id}">✖</button>`;
  else if(m.status=='active'){const role=mineA?'a':'b';act=m.moves[role]?'<small>ждём соперника…</small>':['r','p','s'].map(x=>`<button class="sm" data-mv="${m.id}:${x}">${RP[x]}</button>`).join(' ')}
  else if(m.w=='x')act='<small>отменена</small>';
  else{const role=mineA?'a':'b',w=m.w;const show=m.type=='rps'?x=>RP[x]:x=>x.join('+');act=`<small>${show(m.res[role])} vs ${show(m.res[role=='a'?'b':'a'])}</small> <b class="${!w?'':w==role?'win':'lose'}">${!w?'Ничья':w==role?'Победа':'Поражение'}</b>`}
  return box+`<div>${act}</div></div>`}).join('');
 $('#v-friends').innerHTML=`<div class="card"><h3>👥 Добавить друга</h3><small>Твой ID: <b style="color:var(--g)">${me.id}</b> — отправь его другу. Друг должен открыть игру.</small><div style="display:flex;gap:8px;margin-top:8px"><input id="fid" inputmode="numeric" placeholder="ID друга"><button class="sm p" id="fa">Добавить</button></div></div>
 ${soc.requests.length?`<div class="card"><h3>📩 Заявки</h3>${soc.requests.map(id=>`<div class="row"><span class="av">${(P[id]&&P[id].avatar)||'😎'}</span><div class="n"><b>${nm(id)}</b></div><button class="sm p" data-fa="${id}">Принять</button><button class="sm r" data-fd="${id}">✖</button></div>`).join('')}</div>`:''}
 <div class="card"><h3>Друзья (${fr.length})</h3>${fr.length?fr.map(f=>`<div class="row"><span class="av">${f.avatar}</span><div class="n"><b><span class="dot ${f.online?'on':''}"></span>${esc(f.nick)}</b><small>Ур. ${f.level} · ${f.online?'в сети':'не в сети'}</small></div><button class="sm p" data-du="${f.id}">⚔️</button><button class="sm" data-fr="${f.id}">✖</button></div>`).join(''):'<small>Пока никого. Добавь друга по ID.</small>'}</div>
 <div id="duel"></div><div class="card"><h3>⚔️ Дуэли</h3>${mt||'<small>Вызови друга на дуэль кнопкой ⚔️</small>'}</div>`;
 const act=(a,d)=>api(a,d).then(r=>{if(r.msg)tg.showAlert(r.msg);social()}).catch(e=>tg.showAlert(e.message));
 $('#fa').onclick=()=>act('friend_add',{id:$('#fid').value});
 $$('[data-fa]').forEach(b=>b.onclick=()=>act('friend_accept',{id:b.dataset.fa}));$$('[data-fd]').forEach(b=>b.onclick=()=>act('friend_decline',{id:b.dataset.fd}));
 $$('[data-fr]').forEach(b=>b.onclick=()=>tg.showConfirm('Удалить из друзей?',ok=>ok&&act('friend_remove',{id:b.dataset.fr})));
 $$('[data-da]').forEach(b=>b.onclick=()=>act('duel_accept',{id:b.dataset.da}));$$('[data-dd]').forEach(b=>b.onclick=()=>act('duel_decline',{id:b.dataset.dd}));
 $$('[data-mv]').forEach(b=>b.onclick=()=>{const[i,m]=b.dataset.mv.split(':');act('duel_move',{id:i,move:m})});
 $$('[data-du]').forEach(b=>b.onclick=()=>{const id=b.dataset.du;let type='dice';const d=$('#duel');d.dataset.open=1;d.innerHTML=`<div class="card"><h3>Вызов: ${esc(P[id].nick)}</h3><div class="opt" id="dt">${Object.entries(DT).map(([k,v],i)=>`<button data-t="${k}" class="${i?'':'on'}">${v}</button>`).join('')}</div>${betBox()}<small>Победитель забирает банк (комиссия ${cfg.duelFee}%)</small><button class="go" id="ds" style="margin-top:8px">Отправить вызов</button><button class="sm" id="dc" style="width:100%;margin-top:6px">Отмена</button></div>`;
  sel('#dt',x=>type=x.dataset.t);$('#dc').onclick=()=>{d.innerHTML='';delete d.dataset.open};
  $('#ds').onclick=()=>api('duel_create',{friend:id,type,bet:+$('#duel .amt').value}).then(r=>{d.innerHTML='';delete d.dataset.open;tg.showAlert(r.msg);social()}).catch(e=>tg.showAlert(e.message));d.scrollIntoView()})}

/* ---------- старт ---------- */
api('me').then(r=>{cfg=r.cfg;renderGames()}).catch(e=>{document.body.innerHTML='<p style="padding:30px;text-align:center">'+esc(e.message)+'</p>'});
</script></body></html>
